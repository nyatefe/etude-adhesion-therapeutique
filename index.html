/* ===== Maquette eCRF v0.2 — design system (document 04, repris tel quel) ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.35}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:-.2px}
.sora{font-family:'Sora',sans-serif}
svg.i{display:inline-block;vertical-align:middle;flex:none}

:root{
  --ink:#0F172A; --ink2:#334155; --muted:#64748B; --muted2:#94A3B8;
  --line:#E2E8F0; --line2:#EEF2F7; --bg:#F3F5FB;
  --red:#EF4444; --red-d:#B91C1C; --red-bg:#FEE2E2;
  --amber:#F59E0B; --amber-d:#B45309; --amber-bg:#FEF3C7;
  --violet:#8B5CF6; --violet-d:#6D28D9; --violet-bg:#EDE9FE;
  --green:#10B981; --green-d:#047857; --green-bg:#D1FAE5;
  --blue:#3B82F6; --blue-d:#1D4ED8; --blue-bg:#DBEAFE;
  --sky:#0EA5E9; --teal:#14B8A6; --pink:#EC4899; --orange:#F97316; --indigo:#6366F1; --lime:#84CC16;
  --chg:#0070C0;
}

/* ---------- App canvas ---------- */
.app{width:100%;min-height:100vh;display:flex;background:var(--bg);position:relative}
.side{width:238px;flex:none;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:18px 0 14px}
.side::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-170px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.side::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-140px;bottom:40px;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 70%)}
.brand{display:flex;align-items:center;gap:11px;padding:0 18px 16px;position:relative;z-index:1}
.brand .mk{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 200deg,#F472B6,#FB923C,#FACC15,#34D399,#22D3EE,#818CF8,#F472B6);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.brand .mk .in{width:34px;height:34px;border-radius:10px;background:rgba(15,23,42,.82);display:flex;align-items:center;justify-content:center}
.brand .t1{font-family:'Sora';font-weight:800;font-size:16.5px;line-height:1.05;letter-spacing:-.3px}
.brand .t2{font-family:'Sora';font-weight:600;font-size:12.5px;opacity:.82;letter-spacing:-.1px}
.brand .t3{font-size:8.8px;letter-spacing:1.6px;text-transform:uppercase;opacity:.6;font-weight:700;margin-top:3px}
.who{margin:0 14px 12px;padding:10px 11px;border-radius:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.av{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:12.5px;color:#fff;flex:none}
.who .nm{font-weight:700;font-size:12.5px;line-height:1.2}
.who .rl{font-size:10.5px;opacity:.75}
.navsec{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;opacity:.55;font-weight:800;padding:10px 22px 5px;position:relative;z-index:1}
.navi{display:flex;align-items:center;gap:11px;margin:1px 12px;padding:7px 11px;border-radius:11px;font-size:13px;font-weight:600;color:rgba(255,255,255,.86);position:relative;z-index:1}
.navi .ib{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);flex:none}
.navi.on{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.navi .cnt{margin-left:auto;font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.16);color:#fff}
.navi .cnt.r{background:#EF4444;color:#fff}
.navi .cnt.a{background:#F59E0B;color:#fff}
.navi .cnt.v{background:#8B5CF6;color:#fff}
.navi.on .cnt{background:#EEF2FF;color:#3730A3}
.navi.on .cnt.r{background:#EF4444;color:#fff}
.sfoot{margin:auto 14px 0;padding:11px 12px;border-radius:13px;background:rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.sfoot .k{font-size:9.5px;opacity:.7;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.sfoot .v{font-family:'Sora';font-weight:700;font-size:12.5px}
.sfoot .s{font-size:10.5px;opacity:.8}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:62px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px}
.top .crumb{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.top .h{font-family:'Sora';font-weight:700;font-size:19px;letter-spacing:-.3px;line-height:1.15;white-space:nowrap}
.top .srch{display:flex;align-items:center;gap:8px;background:#F1F5F9;border-radius:11px;padding:8px 12px;flex:0 1 260px;min-width:110px;color:var(--muted2);font-size:12px;margin-left:12px;white-space:nowrap;overflow:hidden}
.top .sp{flex:1}
.demo{white-space:nowrap;font-size:9.5px;font-weight:800;letter-spacing:.8px;color:#92400E;padding:5px 9px;border-radius:8px;background:repeating-linear-gradient(-45deg,#FEF3C7,#FEF3C7 6px,#FDE68A 6px,#FDE68A 12px)}
.bell{position:relative;width:38px;height:38px;border-radius:11px;background:#F1F5F9;display:flex;align-items:center;justify-content:center}
.bell .b{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;border-radius:10px;background:#EF4444;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.me .nm{font-weight:700;font-size:12.5px;line-height:1.2;white-space:nowrap}
.me .rl{white-space:nowrap}
.me .rl{font-size:10.5px;color:var(--muted)}
.swb{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2);border:1px solid var(--line);padding:7px 10px;border-radius:10px;background:#fff}
.content{flex:1;padding:18px 22px;position:relative;overflow:hidden}

/* ---------- Generic components ---------- */
.row{display:flex;gap:16px}
.col{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);padding:16px 18px;position:relative}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ch .t{font-family:'Sora';font-weight:700;font-size:14.5px;letter-spacing:-.2px}
.ch .s{font-size:11px;color:var(--muted);margin-top:1px}
.ch .sp{flex:1}
.h2row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.h2{font-family:'Sora';font-weight:800;font-size:22px;letter-spacing:-.5px}
.h2s{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}

.btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;padding:9px 15px;border-radius:11px;color:#fff;white-space:nowrap}
.btn.sm{font-size:11px;padding:5px 10px;border-radius:9px;gap:5px}
.btn.green{background:linear-gradient(135deg,#34D399,#059669);box-shadow:0 4px 12px rgba(16,185,129,.35)}
.btn.red{background:linear-gradient(135deg,#F87171,#DC2626);box-shadow:0 4px 12px rgba(239,68,68,.30)}
.btn.violet{background:linear-gradient(135deg,#A78BFA,#7C3AED);box-shadow:0 4px 12px rgba(139,92,246,.30)}
.btn.orange{background:linear-gradient(135deg,#FDBA74,#EA580C);box-shadow:0 4px 12px rgba(249,115,22,.30)}
.btn.blue{background:linear-gradient(135deg,#60A5FA,#2563EB);box-shadow:0 4px 12px rgba(59,130,246,.30)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line);box-shadow:none}
.btn.hov{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 8px 20px rgba(16,185,129,.45)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%}
.p-red{background:var(--red-bg);color:var(--red-d)} .p-red .d{background:var(--red)}
.p-amber{background:var(--amber-bg);color:var(--amber-d)} .p-amber .d{background:var(--amber)}
.p-violet{background:var(--violet-bg);color:var(--violet-d)} .p-violet .d{background:var(--violet)}
.p-green{background:var(--green-bg);color:var(--green-d)} .p-green .d{background:var(--green)}
.p-blue{background:var(--blue-bg);color:var(--blue-d)} .p-blue .d{background:var(--blue)}
.p-grey{background:#F1F5F9;color:#475569} .p-grey .d{background:#94A3B8}
.p-sky{background:#E0F2FE;color:#0369A1} .p-teal{background:#CCFBF1;color:#0F766E} .p-pink{background:#FCE7F3;color:#BE185D}
.p-orange{background:#FFEDD5;color:#C2410C} .p-indigo{background:#E0E7FF;color:#4338CA} .p-lime{background:#ECFCCB;color:#4D7C0F}
.p-solid-red{background:#EF4444;color:#fff}

.code{font-family:'JetBrains Mono';font-weight:700;font-size:12px}
.muted{color:var(--muted)}
.b{font-weight:700}

/* KPI cards (solid colors) */
.kpis{display:grid;gap:14px;margin-bottom:16px}
.kpi{border-radius:18px;padding:14px 16px 13px;color:#fff;position:relative;overflow:hidden;min-height:112px}
.kpi::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-40px;top:-50px;background:rgba(255,255,255,.14)}
.kpi .kl{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;opacity:.95;position:relative;z-index:1}
.kpi .kl .ki{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.kpi .kv{font-family:'Sora';font-weight:800;font-size:34px;line-height:1;margin-top:10px;letter-spacing:-1px;position:relative;z-index:1}
.kpi .kv small{font-size:16px;font-weight:600;opacity:.8;margin-left:3px;letter-spacing:0}
.kpi .kf{font-size:10.8px;margin-top:7px;opacity:.92;font-weight:600;position:relative;z-index:1}
.kpi .kb{height:6px;border-radius:6px;background:rgba(255,255,255,.28);margin-top:8px;position:relative;z-index:1;overflow:hidden}
.kpi .kb i{display:block;height:100%;border-radius:6px;background:#fff}
.kpi .bgi{position:absolute;right:10px;bottom:6px;opacity:.16;z-index:0}
.g-indigo{background:linear-gradient(135deg,#818CF8 0%,#4F46E5 100%)}
.g-orange{background:linear-gradient(135deg,#FDBA74 0%,#EA580C 100%)}
.g-sky{background:linear-gradient(135deg,#7DD3FC 0%,#0284C7 100%)}
.g-rose{background:linear-gradient(135deg,#FDA4AF 0%,#E11D48 100%)}
.g-emerald{background:linear-gradient(135deg,#6EE7B7 0%,#059669 100%)}
.g-violet{background:linear-gradient(135deg,#C4B5FD 0%,#7C3AED 100%)}
.g-amber{background:linear-gradient(135deg,#FCD34D 0%,#D97706 100%)}
.g-teal{background:linear-gradient(135deg,#5EEAD4 0%,#0D9488 100%)}
.g-pink{background:linear-gradient(135deg,#F9A8D4 0%,#DB2777 100%)}
.g-slate{background:linear-gradient(135deg,#94A3B8 0%,#334155 100%)}
.g-blue{background:linear-gradient(135deg,#93C5FD 0%,#2563EB 100%)}

/* Tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th{background:#F8FAFC;color:#64748B;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line)}
.tbl th:first-child{border-top-left-radius:10px} .tbl th:last-child{border-top-right-radius:10px}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.hov td{background:#EEF2FF}
.tbl tr.hov td:first-child{box-shadow:inset 3px 0 0 #6366F1}
.tbl.tight td{padding:4px 8px} .tbl.tight th{padding:6px 8px}

/* Mini bars */
.mbar{height:8px;border-radius:8px;background:#EEF2F7;overflow:hidden;position:relative}
.mbar i{display:block;height:100%;border-radius:8px}

/* Flags */
.flag{display:inline-flex;align-items:center;gap:3px;font-family:'JetBrains Mono';font-weight:800;font-size:11px}
.fl-red{color:#DC2626} .fl-amber{color:#D97706} .fl-violet{color:#DC2626} .fl-green{color:#059669}

/* Field blocks */
.fb{border-radius:15px;padding:12px 14px;position:relative}
.fb .fbh{display:flex;align-items:center;gap:8px;font-family:'Sora';font-weight:700;font-size:12.5px;margin-bottom:9px}
.fb .fbh .ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.fb-indigo{background:#EEF2FF;border:1px solid #E0E7FF} .fb-indigo .fbh{color:#3730A3} .fb-indigo .ic{background:#6366F1}
.fb-rose{background:#FFF1F2;border:1px solid #FFE4E6} .fb-rose .fbh{color:#BE123C} .fb-rose .ic{background:#F43F5E}
.fb-teal{background:#F0FDFA;border:1px solid #CCFBF1} .fb-teal .fbh{color:#0F766E} .fb-teal .ic{background:#14B8A6}
.fb-amber{background:#FFFBEB;border:1px solid #FEF3C7} .fb-amber .fbh{color:#B45309} .fb-amber .ic{background:#F59E0B}
.fb-sky{background:#F0F9FF;border:1px solid #E0F2FE} .fb-sky .fbh{color:#0369A1} .fb-sky .ic{background:#0EA5E9}
.fl{font-size:10.8px;color:#64748B;font-weight:600;margin-bottom:3px}
.fv{font-family:'Sora';font-weight:700;font-size:15px;color:#0F172A}
.fv small{font-family:'Plus Jakarta Sans';font-size:11px;font-weight:600;color:#64748B}
.fgrid{display:grid;gap:10px 14px}
.yn{display:inline-flex;background:#fff;border-radius:9px;padding:2px;border:1px solid rgba(15,23,42,.08)}
.yn span{font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:7px;color:#94A3B8}
.yn span.on-g{background:#10B981;color:#fff}
.yn span.on-r{background:#EF4444;color:#fff}
.yn span.on-b{background:#6366F1;color:#fff}
.yn span.on-n{background:#475569;color:#fff}

/* Tooltip / popover / toast / cursor */
.tip{position:absolute;background:#0F172A;color:#fff;font-size:11px;font-weight:600;padding:7px 10px;border-radius:9px;box-shadow:0 8px 20px rgba(15,23,42,.35);white-space:nowrap;z-index:30;line-height:1.35}
.tip b{font-family:'Sora'}
.tip::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#0F172A}
.tip.down::after{bottom:auto;top:-5px;border-top:0;border-bottom:5px solid #0F172A}
.pop{position:absolute;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(15,23,42,.06),0 18px 40px rgba(15,23,42,.22);padding:13px 14px;z-index:30}
.toast{position:absolute;display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:11px 14px;box-shadow:0 0 0 1px rgba(15,23,42,.05),0 16px 36px rgba(15,23,42,.20);z-index:40;font-size:12px}
.toast .ti{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#34D399,#059669);display:flex;align-items:center;justify-content:center}
.cursor{position:absolute;z-index:50;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ripple{position:absolute;z-index:45;border-radius:50%;border:2px solid rgba(99,102,241,.55);background:rgba(99,102,241,.15)}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:8px 12px;border-radius:11px;background:#fff;color:#475569;border:1px solid var(--line)}
.tab.on{color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(15,23,42,.18)}
.seg{display:inline-flex;background:#fff;border-radius:12px;padding:4px;gap:3px;border:1px solid var(--line)}
.seg span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;color:#64748B}
.seg span.on{background:#0F172A;color:#fff}
.seg span .n{font-family:'JetBrains Mono';font-size:10.5px;padding:1px 6px;border-radius:10px;background:#F1F5F9;color:#475569}
.seg span.on .n{background:rgba(255,255,255,.2);color:#fff}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#475569;font-weight:600;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:11px;color:#475569;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:11px;padding:8px 11px}

/* ===== Compléments pour l'application interactive (étape 1) ===== */
html,body{background:var(--bg)}
body{min-width:1200px}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.btn{cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s;border:0}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.green:hover{box-shadow:0 8px 20px rgba(16,185,129,.45)}
.btn.ghost:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn[disabled],.btn.dis{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.3)}
.btn.prof{background:var(--pgrad);box-shadow:0 4px 12px rgba(15,23,42,.18)}

/* barre latérale collante (la colonne garde la couleur du profil sur toute la hauteur) */
.sidecol{width:238px;flex:none;background:var(--side)}
.side{position:sticky;top:0;height:100vh;background:var(--side)}
.side .navwrap{flex:1;overflow-y:auto;position:relative;z-index:1;padding-bottom:10px;scrollbar-width:none}
.side .navwrap::-webkit-scrollbar{display:none}
.navi{cursor:pointer;transition:background .15s,color .15s}
.navi:hover:not(.on){background:rgba(255,255,255,.10);color:#fff}
.navi.on .ib{background:var(--pgrad);color:#fff}
.navi .lbl{line-height:1.2}
.top{position:sticky;top:0;z-index:20}
.top .srch{position:relative;overflow:visible;cursor:text}
.top .srch input{border:0;background:transparent;outline:0;width:100%;font-size:12px;color:var(--ink)}
.top .srch input::placeholder{color:var(--muted2)}
.bell{cursor:pointer;transition:background .15s}
.bell:hover{background:#E2E8F0}
.swb{cursor:pointer;transition:background .15s,border-color .15s}
.swb:hover{background:#F8FAFC;border-color:#CBD5E1}
.content{overflow:visible;padding-top:12px}

/* pastille de moment */
.mbarre{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-bottom:10px;min-height:26px}
.mpill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
.mpill .d{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.mpill.blue{background:#DBEAFE;color:#1D4ED8} .mpill.blue .d{background:#3B82F6}
.mpill.violet{background:#EDE9FE;color:#6D28D9} .mpill.violet .d{background:#8B5CF6}
.frozen{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#1E293B,#334155);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:12.5px}

/* menus déroulants (cloche, recherche) */
.drop{position:absolute;top:calc(100% + 8px);background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(15,23,42,.06),0 18px 40px rgba(15,23,42,.22);z-index:60;animation:pop .16s ease-out}
.drop .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-family:'Sora';font-weight:700;font-size:13.5px}
.drop .di{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}
.drop .di:hover{background:#F8FAFC}
.drop .di.unread{background:#FAFBFF}
.drop .di .dic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.drop .di .dt{font-size:12px;font-weight:600;line-height:1.35;color:var(--ink)}
.drop .di .dd{font-size:10.5px;color:var(--muted);margin-top:2px}
.drop .di .dot{width:8px;height:8px;border-radius:50%;background:#EF4444;margin-top:6px;flex:none}
.drop .empty{padding:14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line2)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* info-bulles au survol (attribut data-tip) */
#tipLayer{position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .12s}
#tipLayer.on{opacity:1}
#tipLayer .tip{position:relative;white-space:normal;max-width:300px}

/* messages de confirmation */
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:300}
#toasts .toast{position:relative;min-width:300px;max-width:420px;animation:tin .2s ease-out}
#toasts .toast.out{animation:tout .25s ease-in forwards}
#toasts .toast .ti.red{background:linear-gradient(135deg,#F87171,#DC2626)}
#toasts .toast .ti.amber{background:linear-gradient(135deg,#FCD34D,#D97706)}
#toasts .toast .ti.blue{background:linear-gradient(135deg,#60A5FA,#2563EB)}
#toasts .toast b{font-family:'Sora';font-size:12.5px;display:block}
#toasts .toast .ts{font-size:11px;color:var(--muted);margin-top:1px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}

/* fenêtres modales */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:250;animation:fade .15s}
#modal .mbox{background:#fff;border-radius:18px;box-shadow:0 30px 60px rgba(15,23,42,.35);width:460px;max-width:92vw;padding:20px 22px;animation:pop .18s ease-out}
#modal .mt{display:flex;gap:12px;align-items:center;font-family:'Sora';font-weight:700;font-size:16px;margin-bottom:8px}
#modal .mt .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
#modal .mx{font-size:12.5px;color:var(--ink2);line-height:1.5}
#modal .ma{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== Écran de connexion (écran 1) ===== */
.login{display:flex;min-height:100vh;background:#F7F9FC}
.lg-left{width:42%;min-width:480px;position:relative;overflow:hidden;color:#fff;padding:42px 48px;display:flex;flex-direction:column;
  background:linear-gradient(150deg,#022C22 0%,#065F46 35%,#059669 68%,#34D399 100%)}
.lg-left::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-260px;top:-200px;background:radial-gradient(circle,rgba(255,255,255,.20),rgba(255,255,255,0) 68%)}
.lg-left::after{content:"";position:absolute;width:460px;height:460px;border-radius:50%;left:-230px;bottom:-140px;background:radial-gradient(circle,rgba(255,255,255,.13),rgba(255,255,255,0) 70%)}
.lg-left > *{position:relative;z-index:1}
.lg-brand{display:flex;align-items:center;gap:13px}
.lg-brand .mk{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 200deg,#F472B6,#FB923C,#FACC15,#34D399,#22D3EE,#818CF8,#F472B6);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.lg-brand .mk .in{width:37px;height:37px;border-radius:11px;background:rgba(15,23,42,.82);display:flex;align-items:center;justify-content:center}
.lg-brand .t1{font-family:'Sora';font-weight:700;font-size:20px;letter-spacing:-.3px}
.lg-brand .t3{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;opacity:.65;font-weight:700;margin-top:2px}
.lg-h{font-family:'Sora';font-weight:800;font-size:44px;line-height:1.08;letter-spacing:-1.5px;margin-top:96px}
.lg-s{font-size:15px;opacity:.88;margin-top:18px;max-width:440px;line-height:1.45}
.lg-pts{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.lg-pt{display:flex;align-items:center;gap:14px;font-weight:700;font-size:14px}
.lg-pt .ic{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.lg-card{margin-top:auto;align-self:flex-end;width:250px;border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.lg-card .k{font-size:11.5px;font-weight:700;opacity:.9}
.lg-card .v{font-family:'Sora';font-weight:800;font-size:34px;letter-spacing:-1px;margin-top:4px}
.lg-card .v small{font-size:15px;font-weight:700;opacity:.85}
.lg-card .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
.lg-card .bar i{display:block;height:100%;background:#fff;border-radius:6px}
.lg-right{flex:1;padding:28px 46px 24px;display:flex;flex-direction:column}
.lg-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lg-topline .demo{font-size:10.5px;padding:6px 12px}
.lg-lang{font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;position:relative;display:flex;align-items:center;gap:4px}
.lg-cols{display:grid;grid-template-columns:minmax(330px,1fr) minmax(340px,1fr);gap:42px;margin-top:26px}
.lg-form h1{font-family:'Sora';font-weight:800;font-size:34px;letter-spacing:-1px}
.lg-form .sub{font-size:14px;color:var(--muted);margin-top:6px}
.lg-lab{font-size:13px;font-weight:700;color:var(--ink2);margin:22px 0 7px}
.lg-in{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;transition:border-color .15s,box-shadow .15s}
.lg-in:focus-within{border-color:#22D3EE;box-shadow:0 0 0 4px rgba(34,211,238,.18)}
.lg-in input{border:0;outline:0;background:transparent;flex:1;font-family:'JetBrains Mono';font-size:15px;font-weight:600}
.lg-in .eye{color:var(--muted2);cursor:pointer;display:flex}
.lg-btn{margin-top:22px;width:100%;justify-content:center;padding:14px;font-size:14px;border-radius:13px;background:linear-gradient(135deg,#34D399,#047857);box-shadow:0 10px 24px rgba(16,185,129,.35)}
.lg-err{margin-top:12px;font-size:12px;font-weight:600;color:var(--red-d);background:var(--red-bg);border-radius:10px;padding:8px 11px;display:flex;gap:8px;align-items:center}
.lg-pw{font-size:12px;color:var(--muted);margin-top:14px;white-space:nowrap}
.lg-pw b{font-family:'JetBrains Mono';color:var(--ink)}
.lg-rights{margin-top:24px;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06)}
.lg-rights .t{font-family:'Sora';font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center}
.lg-rights p{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.lg-rights .pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.lg-rights .pills .pill{font-size:12px;padding:4px 11px}
.lg-acc h2{font-family:'Sora';font-weight:700;font-size:16px}
.lg-acc .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.lg-list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.acc{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:7px 13px;border:2px solid transparent;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.05);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;text-align:left;width:100%}
.acc:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,23,42,.10)}
.acc.sel{border-color:#22D3EE;box-shadow:0 0 0 4px rgba(34,211,238,.15),0 8px 20px rgba(15,23,42,.08)}
.acc .av{width:36px;height:36px;font-size:13px}
.acc .id{font-family:'JetBrains Mono';font-weight:800;font-size:12px}
.acc .nm{font-weight:800;font-size:13.5px;line-height:1.2}
.acc .rl{font-size:11.5px;color:var(--muted)}
.acc .go{margin-left:auto;color:var(--muted2);opacity:0;transition:opacity .15s}
.acc:hover .go,.acc.sel .go{opacity:1}

/* ===== Écrans en attente (étapes suivantes) ===== */
.scope{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.scope .r{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink2)}
.scope .r .ok{color:#059669;flex:none;margin-top:1px} .scope .r .no{color:#DC2626;flex:none;margin-top:1px}

/* ===== Réglages ===== */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scen .opt{border:2px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;text-align:left;background:#fff}
.scen .opt:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,23,42,.08)}

/* tableau de bord */

/* alertes */

/* modales */

.fb .fgrid{align-items:end}

.qlhead{display:flex;justify-content:flex-end;margin:-4px 0 8px}

/* ===== Étape 3 — requêtes côté CRO (écran 8, détail, rappel, ouverture depuis un champ) ===== */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qfilters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.qfilters .fsel{font-size:12px;padding:6px 8px;max-width:170px}
.gt5{display:inline-flex;align-items:center;gap:6px;font-family:'Plus Jakarta Sans';font-size:12px;font-weight:700;padding:7px 11px;border-radius:10px;background:#fff;border:1.5px solid #FED7AA;color:#C2410C;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}

.gt5.on{background:linear-gradient(135deg,#FDBA74,#EA580C);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.30)}
.qtable{padding:6px 8px 4px}
.qtable .tbl td{vertical-align:top;padding:9px 9px}

.qtable tr.qr{cursor:pointer}
.qtable tr.qr td{transition:background .12s}
.qtable tr.qr:hover td{background:#EEF2FF}

.qtable td.code{white-space:nowrap}
.qtable td.b{max-width:170px}
.fpill{font-size:10.5px;padding:3px 8px}
.exs{max-width:340px}
.ex{font-size:11.5px;color:#334155;line-height:1.4;padding:4px 8px;border-radius:9px;background:#F8FAFC;margin-bottom:3px}

.ex b{font-weight:700;color:#0F172A}
.ex.a{background:#FFFBEB;color:#78350F}
.ex.r{background:#FEF2F2;color:#991B1B}
.by{white-space:nowrap}
.qav{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;color:#fff;font-family:'Sora';font-weight:800;font-size:9.5px;vertical-align:middle;margin-right:6px}
.qav.ecrf{background:linear-gradient(135deg,#94A3B8,#475569)}
.qavn{font-size:11.5px;font-weight:700;color:#334155;vertical-align:middle}
.dpill{display:inline-flex;align-items:center;font-family:'JetBrains Mono';font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap}
.dpill.red{background:#FEE2E2;color:#B91C1C}
.dpill.hot{background:#EF4444;color:#fff}
.dpill.amber{background:#FEF3C7;color:#B45309}
.dpill.green{background:#D1FAE5;color:#047857}
.dsub{font-size:10px;color:#94A3B8;margin-top:4px;white-space:nowrap}
td.acts{text-align:right;white-space:nowrap}
td.acts .btn{margin-left:5px}
.qfoot{display:flex;align-items:center;gap:14px;padding:10px 6px 6px;flex-wrap:wrap}
.qfoot .legend{flex:1}
.pager{display:flex;align-items:center;gap:6px;font-size:11.5px}

.pager .btn[disabled]{opacity:.4;pointer-events:none}
.qnote{font-size:11px;color:#64748B;padding:2px 6px 8px}

/* fenêtre de détail : historique complet */
.qdh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px}
.qdl{font-size:13px;margin-bottom:12px}
.qdl .mono{font-size:10.5px;margin-left:6px}
.tlist{position:relative;max-height:52vh;overflow:auto;padding:2px 4px 2px 2px}
.tl{display:flex;gap:12px;position:relative;padding-bottom:12px}

.tl:last-child::before{display:none}

.tl.red .tld{background:linear-gradient(135deg,#F87171,#DC2626)}
.tl.amber .tld{background:linear-gradient(135deg,#FCD34D,#D97706)}
.tl.green .tld{background:linear-gradient(135deg,#6EE7B7,#059669)}
.tl.orange .tld{background:linear-gradient(135deg,#FDBA74,#EA580C)}
.tlb{flex:1;min-width:0;border-radius:12px;padding:8px 11px;background:#F8FAFC;border:1px solid #EEF2F7}
.tl.red .tlb{background:#FEF2F2;border-color:#FEE2E2}
.tl.amber .tlb{background:#FFFBEB;border-color:#FEF3C7}
.tl.green .tlb{background:#ECFDF5;border-color:#D1FAE5}
.tl.orange .tlb{background:#FFF7ED;border-color:#FFEDD5}
.tlh{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.tlh .mono{font-size:10.5px;white-space:nowrap}
.tlw{font-size:11.5px;color:#475569;margin-top:2px}
.tlt{font-size:12.5px;color:#0F172A;margin-top:5px;line-height:1.45}
.tlc{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:11.5px;color:#334155}
.tlc span{background:#fff;border-radius:8px;padding:4px 8px;border:1px dashed #CBD5E1}
.tlc s{color:#DC2626}
.tlc b{color:#047857}
.qdbtns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}

/* rappel par e-mail (simulé) */
.mail{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:flex;gap:10px;align-items:baseline;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line2);background:#F8FAFC}
.mrow>span:first-child{width:44px;color:#64748B;font-weight:700;flex:0 0 44px}
.mbody{margin:0;padding:12px 14px;font-family:'Plus Jakarta Sans';font-size:12.2px;line-height:1.55;white-space:pre-wrap;color:#1E293B;background:#fff}

/* nouvelle requête : modèles de questions */
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpl{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;background:#F1F5F9;color:#334155;cursor:pointer;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.tpl:hover{background:#FEF2F2;border-color:#FECACA}
.tpl.on{background:#FEE2E2;border-color:#EF4444;color:#991B1B}

/* bouton « ouvrir une requête » sur chaque champ du dossier (ARC, chef de projet) */
.qadd{display:inline-flex;align-items:center;gap:1px;padding:3px 6px;border-radius:7px;background:#fff;border:1.5px dashed #FCA5A5;color:#DC2626;font-family:'JetBrains Mono';font-size:10px;font-weight:800;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.fcell:hover .qadd,.meds td:hover .qadd,.qadd:focus{opacity:1}
.qadd:hover{background:#FEF2F2;border-style:solid}
.qpop .pa{flex-wrap:wrap}
.thr.orange{background:#FFF7ED;color:#9A3412}
.crohint{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#475569;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:11px;padding:7px 11px;margin-bottom:12px}
#toasts .toast .ti.orange{background:linear-gradient(135deg,#FDBA74,#EA580C)}
#modal .ma .mx-l{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.qtable .tbl th{white-space:nowrap}

/* ===== Étape 4 — profil ARC : tableau de bord, revue, centres, enveloppes, double saisie ===== */
.rowbtn{background:var(--pgrad)}
.hpill{font-size:12px;padding:6px 12px}
.trow.arc:hover{background:#EEF2FF;border-color:#C7D2FE;box-shadow:inset 3px 0 0 #6366F1}
.trow.arc:hover .tbtn{background:var(--pgrad);color:#fff;border-color:transparent}
.tic.blue{background:#DBEAFE}
.qrow.lnk{cursor:pointer;border-radius:8px;transition:background .15s}
.qrow.lnk:hover{background:#F8FAFC}
.legend i.dash{width:18px;height:0;border-top:2px dashed #94A3B8;border-radius:0}
.curve{display:block;overflow:visible}
.curve rect:hover{fill:rgba(99,102,241,.06)}

/* tuiles des centres */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.arcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;align-items:start}
.arc2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

.arc2 .qrow{grid-template-columns:16px minmax(0,1.3fr) minmax(0,.8fr) 24px;gap:7px}
.arc2 .qrow .ql span{display:none}
.qqs{display:flex;flex-direction:column;gap:4px}
.qq{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 6px;border-radius:10px;cursor:pointer;transition:background .12s}
.qq:hover{background:#EFF6FF}
.qqi{width:26px;height:26px;border-radius:8px;background:#DBEAFE;display:flex;align-items:center;justify-content:center}
.qq .pill{font-size:10px;padding:2px 7px}
.ctile{border-radius:13px;padding:8px 9px 7px;cursor:pointer;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s;min-width:0}
.ctile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,23,42,.12)}
.ctile.st-green{background:#ECFDF5;border-color:#A7F3D0}
.ctile.st-amber{background:#FFFBEB;border-color:#FDE68A}
.ctile.st-red{background:#FEF2F2;border-color:#FECACA}
.ctile.st-prep{background:#F8FAFC;border-color:#E2E8F0;border-style:dashed}
.cth{display:flex;align-items:center;gap:6px;min-width:0}
.cth .mbar{flex:1;height:5px;background:rgba(15,23,42,.08)}
.ccode{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 5px;border-radius:7px;color:#fff;font-family:'JetBrains Mono';font-weight:800;font-size:11px;flex:none}
.ccode.big{min-width:46px;height:40px;border-radius:12px;font-size:18px}
.cn{font-family:'Sora';font-size:13px;min-width:14px;text-align:right}
.cn span{font-size:10px;color:#94A3B8;font-weight:600}
.cinv{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.ctb{display:flex;align-items:center;gap:6px;margin-top:5px}
.ctb .mbar{flex:1;height:6px;background:rgba(15,23,42,.08)}
.ctb b{font-family:'Sora';font-size:13px;min-width:18px;text-align:right}
.ctf{display:flex;align-items:center;gap:3px;margin-top:6px;min-height:20px;flex-wrap:nowrap}
.cflag{display:inline-flex;align-items:center;gap:2px;padding:1px 4px;border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.16);font-family:'JetBrains Mono';font-size:10.5px;font-weight:800;cursor:pointer;transition:transform .12s}
.cflag:hover{transform:scale(1.1)}
.cflag.red{color:#DC2626} .cflag.amber{color:#D97706}
.c5j{font-family:'JetBrains Mono';font-size:9px;font-weight:800;color:#fff;background:#EF4444;padding:1px 4px;border-radius:6px}
.cok{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#047857}
.cok.muted{color:#94A3B8}
.tleg{margin-top:12px}
.tleg i{width:14px;height:10px}
.tleg .sp{flex:1}
.cqlist{max-height:300px;overflow:auto;margin:6px -4px 0}
.cqr{display:flex;align-items:center;gap:7px;padding:6px 6px;border-radius:9px;cursor:pointer;font-size:12px}
.cqr:hover{background:#EEF2FF}
.cqr .code{font-size:11.5px}
.cql{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cqr .fpill{font-size:9.5px;padding:2px 6px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.cqa{font-size:10.5px;font-weight:800;color:#B91C1C;min-width:38px;text-align:right}
.cqa.hot{color:#fff;background:#EF4444;border-radius:6px;padding:1px 4px}
.qpop .pa .btn[style]{color:#fff}

/* dossier : revue */
.savebar.torev{background:#EFF6FF;box-shadow:0 0 0 1.5px #93C5FD,0 10px 24px rgba(37,99,235,.12)}
.savebar.rev{background:#ECFDF5;box-shadow:0 0 0 1px #A7F3D0}
.revchip{margin-left:14px;font-size:11.5px;padding:5px 10px}

/* fiche du centre */
.chead{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);border-top:5px solid var(--rc)}
.chl{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.chn{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:-.3px}
.chs{font-size:12px;color:var(--muted);margin-top:3px}
.fict{font-family:'Plus Jakarta Sans';font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.6px;margin-left:4px}
.chr{display:flex;gap:8px}
.st-green-p{background:#D1FAE5;color:#047857} .st-amber-p{background:#FEF3C7;color:#B45309} .st-red-p{background:#FEE2E2;color:#B91C1C} .st-prep-p{background:#F1F5F9;color:#475569}
.cinvc{display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.cav{width:28px;height:28px;border-radius:9px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:10.5px;flex:none}
.incl{display:flex;align-items:center;gap:8px}
.incl .mbar{flex:1;height:7px}
.incl b{font-size:11.5px;white-space:nowrap}
.cplist{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.cprow{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:9px;cursor:pointer}
.cprow:hover{background:#EEF2FF}
.cprow .pill{margin-left:auto;font-size:10px;padding:2px 7px}
.ptbl.nohov tbody tr{cursor:default}
.ptbl tr.crit td{background:#FEF2F2}
.dvdesc{max-width:380px;font-size:11.8px;line-height:1.4}
.dvf{display:grid;grid-template-columns:1fr 1.2fr 1.3fr 1fr;gap:10px}
.dvf .inp{width:100%}

/* enveloppes */
.nlgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px 16px;align-items:end}
.epills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.epill{display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono';font-weight:700;font-size:11.5px;padding:4px 9px;border-radius:9px;border:1.5px dashed #CBD5E1;background:#fff;color:#475569;cursor:pointer;transition:all .12s}
.epill:hover{border-color:#10B981;color:#047857}
.epill.on{background:linear-gradient(135deg,#34D399,#059669);border:1.5px solid transparent;color:#fff}
.epill.got{background:#F1F5F9;border:1.5px solid #E2E8F0;color:#94A3B8;cursor:default}
.epill.extra{background:#FEF3C7;border:1.5px solid #FCD34D;color:#B45309}
.nladd{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.nlfoot{display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.rsec{margin-bottom:12px}
.rh{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;margin-bottom:6px}
.rh b{font-family:'Sora';margin-left:auto;font-size:15px}
.rh.red{color:#B91C1C} .rh.amber{color:#B45309}
.rrow{display:grid;grid-template-columns:62px 110px 1fr;gap:8px;align-items:center;font-size:11.8px;padding:7px 10px;border-radius:10px;margin-bottom:4px}
.rrow.red{background:#FEF2F2} .rrow.amber{background:#FFFBEB}
.ltiles{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.ltile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border-radius:10px;border:1.5px solid #E2E8F0;background:#F8FAFC;cursor:default;transition:transform .12s}
.ltile[data-act]{cursor:pointer}
.ltile[data-act]:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,23,42,.10)}
.ltile b{font-size:11.5px} .ltile b span{color:#94A3B8;font-weight:600}
.ltile.ok{background:#ECFDF5;border-color:#A7F3D0}
.ltile.miss{background:#FEF2F2;border-color:#FCA5A5}
.ltile.extra{background:#FFFBEB;border-color:#FCD34D}
.ltile.none{opacity:.55}
.lotbox{border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.lbh{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:6px}
.lbk{display:flex;gap:6px;flex-wrap:wrap}

/* double saisie */
.qehead{padding:12px 16px;margin-bottom:12px}
.qeh1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qeh1 .sp{flex:1}
.qeh2{display:grid;grid-template-columns:auto 1fr;gap:18px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.qeh2 .qitem{border:0;padding:0;margin:0}
.qegrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.qeside{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.qeside .card{padding:12px 14px}
.qeside .ch{margin-bottom:6px}
.qetabs{margin-bottom:12px}
.qetabs .tab{cursor:pointer;transition:all .15s}
.qetabs .tab:hover:not(.on){border-color:#CBD5E1;transform:translateY(-1px)}
.tcnt{font-family:'JetBrains Mono';font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;background:#FEF3C7;color:#B45309}
.tab.on .tcnt{background:rgba(255,255,255,.22);color:#fff}
.tcnt.ok{background:transparent;padding:0}
.qbody{padding:6px 16px 10px}
.qintro{font-size:12px;font-style:italic;color:#475569;padding:10px 0 6px}

.stile.t-green{background:#ECFDF5}.stile.t-green b{color:#059669}

.banner.pvb{align-items:center;padding:12px 16px;gap:14px}

.pvbs{font-size:12px;opacity:.92;margin-top:2px;font-weight:500}
.banner.pvb b{font-family:'Sora';font-size:14px}

.pvh{display:flex;align-items:center;gap:7px;font-family:'Sora';font-weight:700;font-size:12.5px;margin-bottom:8px}
.pvf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pvf .inp{width:100%}
.recon td{vertical-align:middle}
.rc{display:flex;align-items:center;gap:7px;font-size:11.8px;flex-wrap:wrap}
.rc>span:first-child{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:6px}

.rc.pvs>span:first-child{background:#FCE7F3;color:#BE123C}

.thl{padding:12px}

.ths{font-size:11.5px;color:#475569;margin:3px 0 2px;line-height:1.35}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px 2px}

/* ---------- Répartition des visites (moment 1) : marges par centre et par jour, avec ancrages ---------- */
GEN.allocDays = function (W, R) {
  var T = GEN.DAY_TOTALS1.slice(), rows = {}, free = [];
  W.centres.forEach(function (c) {
    if (GEN.FIXED_ROWS[c.code]) { rows[c.code] = GEN.FIXED_ROWS[c.code].slice(); GEN.FIXED_ROWS[c.code].forEach(function (v, j) { T[j] -= v; }); }
    else if (c.m1.incl > 0) free.push(c.code);
  });
  var anchors = {}; GEN.ANCHORS.forEach(function (a) { (anchors[a[0]] = anchors[a[0]] || []).push([a[1], a[2]]); });
  var ok = function (code, row) {
    var A = anchors[code]; if (!A) return true;
    for (var i = 0; i < A.length; i++) {
      var k = A[i][0], d = A[i][1], before = 0, upto = 0;
      for (var j = 0; j <= d; j++) { upto += row[j]; if (j < d) before += row[j]; }
      if (!(before < k && k <= upto)) return false;
    }
    return true;
  };
  free.forEach(function (code) {
    var n = W.centreBy[code].m1.incl;
    var w = T.map(function (t) { return t * (0.75 + 0.5 * R()); });
    var row = U.apportion(n, w);
    // réparation des ancrages dans la ligne
    var guard = 0;
    while (!ok(code, row) && guard++ < 500) {
      (anchors[code] || []).forEach(function (a) {
        var k = a[0], d = a[1], before = 0, upto = 0, j;
        for (j = 0; j <= d; j++) { upto += row[j]; if (j < d) before += row[j]; }
        if (upto < k) { for (j = 10; j > d; j--) if (row[j] > 0) { row[j]--; row[d]++; break; } }
        else if (before >= k) { for (j = 0; j < d; j++) if (row[j] > 0) { row[j]--; row[d]++; break; } }
      });
    }
    rows[code] = row;
  });
  // ajustement des totaux par jour (déplacements compatibles avec les ancrages)
  var colSum = function (j) { var s = 0; free.forEach(function (c) { s += rows[c][j]; }); return s; };
  for (var it = 0; it < 20000; it++) {
    var over = [], under = [];
    for (var j = 0; j < 11; j++) { var s = colSum(j); if (s > T[j]) over.push(j); else if (s < T[j]) under.push(j); }
    if (!over.length) break;
    var a = R.pick(over), b = R.pick(under), cand = R.shuffle(free.slice()), moved = false;
    for (var i = 0; i < cand.length && !moved; i++) {
      var row = rows[cand[i]]; if (row[a] <= 0) continue;
      row[a]--; row[b]++;
      if (ok(cand[i], row) && (b !== 5 || row[5] <= 2)) moved = true; else { row[a]++; row[b]--; }
    }
  }
  for (var jj = 0; jj < 11; jj++) {
    var tot = 0; W.centres.forEach(function (c) { if (rows[c.code]) tot += rows[c.code][jj]; });
    if (tot !== GEN.DAY_TOTALS1[jj]) throw new Error('Répartition par jour impossible (' + GEN.DAYS1[jj] + ')');
  }
  return rows;
};

M.counts = function (S, set, c) {

    expected: expected.length, received: Object.keys(received).length, missing: missing, extra: extra,

    alertsCrit: al.filter(function (a) { return !a.ackAt && U.wdBetween(a.at.slice(0, 10), S.today, hol) > 1; }).length,
    devs: devs.length, dv: dv,

};
M.completedAt = function (p) {
  var t = ''; M.FORM_ORDER.forEach(function (f) { if (p.forms[f] && p.forms[f].savedAt > t) t = p.forms[f].savedAt; }); return t;

/* Aperçu des données (dossiers revus, hors retraits) */

  var n = R2.length, v = function (p, f, k) { return p.forms[f] ? p.forms[f].v[k] : undefined; };

/* ---------- Stockage : IndexedDB (base eat_demo), repli localStorage, puis mémoire ---------- */
var STORE = {
  db: null, mode: 'mémoire', mem: {},
  open: function () {
    return new Promise(function (resolve) {
      var done = false, fallback = function () { if (done) return; done = true; STORE.useLocal(); resolve(); };
      try {
        if (!window.indexedDB) return fallback();
        var req = indexedDB.open(REF.DB_NAME, 1);
        req.onupgradeneeded = function (e) { e.target.result.createObjectStore('kv'); };
        req.onsuccess = function (e) { if (done) return; done = true; STORE.db = e.target.result; STORE.mode = 'IndexedDB'; resolve(); };
        req.onerror = fallback; req.onblocked = fallback;
        setTimeout(fallback, 2500);
      } catch (err) { fallback(); }
    });
  },
  useLocal: function () {
    try { localStorage.setItem('eat_demo_test', '1'); localStorage.removeItem('eat_demo_test'); STORE.mode = 'localStorage'; }
    catch (e) { STORE.mode = 'mémoire'; }
  },
  get: function (k) {
    return new Promise(function (resolve) {
      try {
        if (STORE.mode === 'IndexedDB') {
          var r = STORE.db.transaction('kv', 'readonly').objectStore('kv').get(k);
          r.onsuccess = function () { resolve(r.result === undefined ? null : r.result); }; r.onerror = function () { resolve(null); };
        } else if (STORE.mode === 'localStorage') { var s = localStorage.getItem(REF.DB_NAME + ':' + k); resolve(s ? JSON.parse(s) : null); }
        else resolve(STORE.mem[k] === undefined ? null : U.clone(STORE.mem[k]));
      } catch (e) { resolve(null); }
    });
  },
  set: function (k, v) {
    return new Promise(function (resolve) {
      try {
        if (STORE.mode === 'IndexedDB') {
          var tx = STORE.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k);
          tx.oncomplete = function () { resolve(true); }; tx.onerror = function () { resolve(false); };
        } else if (STORE.mode === 'localStorage') { localStorage.setItem(REF.DB_NAME + ':' + k, JSON.stringify(v)); resolve(true); }
        else { STORE.mem[k] = U.clone(v); resolve(true); }
      } catch (e) { resolve(false); }
    });
  }
};

VIEW.searchDrop = function (me) {
  var S = APP.cur(), q = APP.q.trim().toLowerCase(), out = [], msg = '';
  if (!q) return '';
  var isCode = /^\d{2}-?\d{0,3}$/.test(q);
  if (me.kind === 'inv') {
    out = S.patients.filter(function (p) { return p.c === me.centre && p.id.indexOf(q) === 0; }).slice(0, 8)
      .map(function (p) { return { act: 'patient', id: p.id, l: p.id, s: p.ini + ' · ' + M.STATUS[M.status(S, p)].label }; });
    if (!out.length) msg = isCode && q.slice(0, 2) !== me.centre ? 'Aucun patient de votre centre ne correspond : vous ne voyez que le centre ' + me.centre + '.' : 'Aucun patient de votre centre ne correspond.';
  } else if (me.kind === 'servier') {
    out = S.centres.filter(function (c) { return (c.code + ' ' + c.ville + ' ' + c.inv).toLowerCase().indexOf(q) >= 0; }).slice(0, 8)
      .map(function (c) { return { act: 'centre', id: c.code, l: c.inv, s: 'Centre ' + c.code + ' · ' + c.ville }; });
    if (/^\d{2}-\d/.test(q)) { out = []; msg = 'Recherche par code patient non disponible : Servier Maroc ne voit que des chiffres agrégés.'; }
    else if (!out.length) msg = 'Aucun centre ne correspond.';
  } else if (me.kind === 'pv') {
    out = S.patients.filter(function (p) { return p.forms.F7 && p.forms.F7.v.EI === 1 && p.id.indexOf(q) === 0; }).slice(0, 8)
      .map(function (p) { return { act: 'patient', id: p.id, l: p.id, s: 'Événement indésirable' + (p.forms.F7.v.GRAVE === 1 ? ' grave' : '') }; });
    if (!out.length) msg = 'Seuls les patients avec un événement indésirable sont visibles.';
  } else {
    out = S.patients.filter(function (p) { return p.id.indexOf(q) === 0; }).slice(0, 6)
      .map(function (p) { return { act: 'patient', id: p.id, l: p.id, s: APP.centre(p.c).ville + ' · ' + M.STATUS[M.status(S, p)].label }; })
      .concat(S.centres.filter(function (c) { return !isCode && (c.ville + ' ' + c.inv).toLowerCase().indexOf(q) >= 0; }).slice(0, 4)
        .map(function (c) { return { act: 'centre', id: c.code, l: 'Centre ' + c.code + ' — ' + c.ville, s: c.inv }; }));
    if (!out.length) msg = 'Aucun résultat.';
  }
  return '<div class="drop" style="left:0;width:330px">' + out.map(function (r) {
    return '<div class="di" data-act="sres" data-k="' + r.act + '" data-id="' + r.id + '"><span class="dic" style="background:#EEF2FF">' + ic(r.act === 'centre' ? 'building-2' : 'user-round', 14, '#4F46E5') + '</span>' +
      '<div><div class="dt ' + (r.act === 'patient' ? 'code' : '') + '">' + U.esc(r.l) + '</div><div class="dd">' + U.esc(r.s) + '</div></div></div>';
  }).join('') + (msg ? '<div class="empty">' + ic('info', 14) + ' ' + U.esc(msg) + '</div>' : '') + '</div>';
};

ACT.notif = function (el) {
  var S = APP.cur(), me = APP.me(), id = el.dataset.id, hit = null;
  if (me.kind === 'inv') { S.notifRead = S.notifRead || {}; S.notifRead[me.id + '|' + id] = true; }
  else S.notifs.forEach(function (n) { if (n.id === id) { n.read = true; hit = n; } });
  APP.save();
  if (me.kind === 'inv' && /^q:/.test(id)) { APP.go('queries', { qid: id.split(':')[1] }); return; }
  if (me.kind === 'inv' && /^a:/.test(id)) { APP.go('alerts'); return; }
  if (me.kind === 'inv' && /^m:/.test(id) && window.PV) { APP.drop = null; APP.render(); PV.thread(id.split(':')[1]); return; }
  if (hit && me.kind === 'pv' && window.PV) {
    if (hit.pvpid && APP.patient(hit.pvpid)) { APP.drop = null; APP.render(); PV.detail(hit.pvpid); return; }
    if (hit.go) { APP.go(hit.go, JSON.parse(JSON.stringify(hit.gp || {}))); return; }
  }
  // liens directs (requêtes) pour la CRO
  if (hit && (me.kind === 'arc' || me.kind === 'cp') && typeof QRY !== 'undefined') {
    if (hit.qid && QRY.get(hit.qid)) { APP.drop = null; APP.render(); QRY.detail(hit.qid); return; }
    if (hit.go) { APP.go(hit.go, JSON.parse(JSON.stringify(hit.gp || {}))); return; }
  }
  APP.render();
};

/* ---------- Messages, fenêtres, info-bulles ---------- */
function toast(title, sub, tone, icon) {
  var box = document.getElementById('toasts'), t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span class="ti ' + (tone && tone !== 'green' ? tone : '') + '">' + ic(icon || 'check', 16, '#fff') + '</span><div><b>' + U.esc(title) + '</b>' + (sub ? '<div class="ts">' + U.esc(sub) + '</div>' : '') + '</div>';
  box.appendChild(t);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 260); }, 4000);
}
var MODAL = {};
function modal(o) {
  closeModal(); MODAL = o;
  var m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = '<div class="mbox' + (o.wide ? ' wide' : '') + '"><div class="mt"><span class="ic" style="background:' + o.color + '">' + ic(o.icon, 18, '#fff') + '</span>' + U.esc(o.title) + '</div>' + (o.html || '<div class="mx">' + U.esc(o.text) + '</div>') +
    '<div class="ma">' + (o.extra ? '<div class="mx-l">' + o.extra + '</div>' : '') + (o.noCancel ? '' : '<button class="btn ghost" data-act="modalCancel">' + U.esc(o.cancel || 'Annuler') + '</button>') + '<button class="btn ' + (o.okClass || 'green') + '" data-act="modalOk">' + U.esc(o.ok) + '</button></div></div>';
  m.addEventListener('click', function (e) { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal() { var m = document.getElementById('modal'); if (m) m.remove(); }
function closeTip() { var t = document.getElementById('tipLayer'); if (t) t.className = ''; }

document.addEventListener('click', function (e) {
  if (!e.target.closest('#popLayer') && !e.target.closest('[data-act="qpop"]')) FUI.closePop();
  var el = e.target.closest('[data-act]');
  if (!el) {
    if (APP.drop && !e.target.closest('.drop') && !e.target.closest('#srch')) { APP.drop = null; APP.render(); }
    return;
  }
  if (APP.drop && el.dataset.act !== 'bell' && el.dataset.act !== 'notif' && el.dataset.act !== 'notifAll' && el.dataset.act !== 'sres') APP.drop = null;
  var f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeModal(); if (APP.drop) { APP.drop = null; APP.render(); } }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); ACT[e.target.dataset.enter](e.target); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'srch') {
    APP.q = e.target.value; APP.drop = APP.q ? 'search' : null;
    var pos = e.target.selectionStart; APP.render();
    var i = document.getElementById('srch'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  }
  if (e.target.id === 'lgId') APP.loginId = e.target.value;
  var t = e.target, ds = t.dataset || {};
  if (ds.buf && t.tagName !== 'SELECT') {
    var bf = APP.bufs[ds.buf]; if (!bf || bf.ro) return;
    if (ds.row !== undefined) { var row = bf.v.MEDS[+ds.row]; row[ds.col] = ds.col === 'MOL_AUT' ? t.value : FUI.parse(ds.col === 'DOSE' ? 'dec' : 'int', t.value); }
    else if (ds.sub === 'v') { bf.v[ds.k] = bf.v[ds.k] || { u: ds.t === 'hba1c' ? '%' : 'g/L' }; bf.v[ds.k].v = FUI.parse('dec', t.value); }
    else {
      if (ds.up) { var pos = t.selectionStart; t.value = t.value.toUpperCase(); t.setSelectionRange(pos, pos); }
      bf.v[ds.k] = FUI.parse(ds.t, t.value, ds.up);
      var dm = /^(DIAG|TTT)(AN|DUR)$/.exec(ds.k); if (dm && !bf.v[dm[1] + '_SAISIE']) bf.v[dm[1] + '_SAISIE'] = dm[2] === 'AN' ? 'an' : 'dur';
    }
    if (bf.errors) delete bf.errors[ds.k];
    FUI.updateCalc(ds.buf); FUI.refreshBar(ds.buf);
    if (ds.buf.indexOf('q_') === 0) INV.liveCmp(t);
  }
});
document.addEventListener('change', function (e) {
  var t = e.target, ds = t.dataset || {};
  if (!ds.buf) return;
  var bf = APP.bufs[ds.buf]; if (!bf || bf.ro) return;
  if (t.tagName === 'SELECT') {
    if (ds.row !== undefined) { var row = bf.v.MEDS[+ds.row]; row[ds.col] = t.value; if (ds.col === 'CLASSE') row.MOL = ''; }
    else if (ds.sub === 'u') { bf.v[ds.k] = bf.v[ds.k] || {}; bf.v[ds.k].u = t.value; }
    else bf.v[ds.k] = t.value === '' ? undefined : +t.value;
    if (t.closest('#modal')) return;
    APP.render();
  } else if (ds.k === 'GAJ') APP.render();
});
document.addEventListener('mouseover', function (e) {
  var el = e.target.closest('[data-tip]'), L = document.getElementById('tipLayer');
  if (!el) { L.className = ''; return; }
  var P = document.getElementById('popLayer');
  if (P && P.className === 'on' && el.classList.contains('qflag')) { L.className = ''; return; }   // pas d'info-bulle sur le drapeau dont la fenêtre est ouverte
  L.innerHTML = '<div class="tip">' + U.esc(el.dataset.tip) + '</div>';
  var r = el.getBoundingClientRect(); L.className = 'on';
  var w = L.offsetWidth, h = L.offsetHeight;
  L.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  L.style.top = Math.max(8, r.top - h - 8) + 'px';
});
window.addEventListener('scroll', closeTip, true);

/* Champs modifiables pour répondre à une requête (à partir de l'identifiant du champ) */
SCH.targets = function (q) {
  var m = /^(F\d)_(.+)$/.exec(q.field || ''); if (!m) return [];
  var f = m[1], k = m[2], mm = /^MED(\d)_(\w+)$/.exec(k);
  if (mm) { var i = +mm[1] - 1; return mm[2] === 'MOL' ? [{ f: f, k: 'MEDS.' + i + '.CLASSE' }, { f: f, k: 'MEDS.' + i + '.MOL' }] : [{ f: f, k: 'MEDS.' + i + '.' + mm[2] }]; }
  var map = { F2_IMC: [['F2', 'POIDS'], ['F2', 'TAILLE']], F4_NBCPHTA: [['F3', 'NBCPTOT'], ['F4', 'NBCPHTA']], F3_NBCPTOT: [['F3', 'NBCPTOT'], ['F4', 'NBCPHTA']],
    F4_PAS: [['F4', 'PAS'], ['F4', 'PAD']], F7_DECLDAT: [['F7', 'DECL'], ['F7', 'DECLDAT']], F7_DECL: [['F7', 'DECL'], ['F7', 'DECLDAT']],
    F3_COMOR: [['F3', 'COMOR'], ['F3', 'COMBOX']], F3_COMBOX: [['F3', 'COMOR'], ['F3', 'COMBOX']], F4_MHD: [['F4', 'MHD'], ['F4', 'MHDBOX']], F4_MHDBOX: [['F4', 'MHD'], ['F4', 'MHDBOX']], F6_MICROBOX: [['F6', 'COMPL'], ['F6', 'MICROBOX']], F4_DIAGAN: [['F4', 'DIAG']], F5_DIAGAN: [['F5', 'DIAG']], F6_DIAGAN: [['F6', 'DIAG']],
    F4_TTTAN: [['F4', 'TTT'], ['F4', 'DIAG']], F4_TTTMED: [['F4', 'TTTMED']] };
  if (map[q.field]) return map[q.field].map(function (x) { return { f: x[0], k: x[1] }; });
  return [{ f: f, k: k }];
};

/* ==========================================================================

/* ---------- utilitaires de valeurs ---------- */
FUI.get = function (v, k) { return k.indexOf('.') >= 0 ? GEN.get(v, k) : v[k]; };
FUI.set = function (v, k, x) { if (k.indexOf('.') >= 0) GEN.set(v, k, x); else v[k] = x; };
FUI.optLabel = function (o, val) { var r = (o || []).filter(function (x) { return x[0] === val; })[0]; return r ? r[1] : ''; };
FUI.fmt = function (f, k, val, v) {
  if (val === undefined || val === null || val === '') return '—';
  var m = /^MEDS\.(\d+)\.(\w+)$/.exec(k);
  if (m) return m[2] === 'AF' ? (val === 1 ? 'Oui' : 'Non') : m[2] === 'DOSE' ? U.num(val) : String(val);
  if (k === 'MEDS') return (val || []).map(function (r) { return r.MOL + (r.DOSE ? ' ' + U.num(r.DOSE) : ''); }).join(', ') || 'aucun';
  var fl = SCH.field(f, k);
  if (!fl) return String(val);
  if (fl.t === 'yn') return val === 1 ? 'Oui' : val === 2 ? 'Non' : String(val);
  if (fl.t === 'seg' || fl.t === 'sel') return FUI.optLabel(fl.o, val) || String(val);
  if (fl.t === 'date') return /^\d{4}-/.test(val) ? U.fr(val) : String(val);
  if (fl.t === 'dec') return U.num(val);
  if (fl.t === 'lab' || fl.t === 'gaj' || fl.t === 'hba1c') return typeof val === 'object' ? U.num(val.v) + ' ' + val.u : String(val);
  if (fl.t === 'cases') return fl.o.filter(function (o) { return v && v[o[0]] === 1; }).map(function (o) { return o[1]; }).join(', ') || 'aucune';
  return String(val) + (fl.u && typeof val === 'number' ? ' ' + fl.u : '');
};
FUI.parse = function (t, s, upper) {
  s = (s === undefined || s === null) ? '' : String(s).trim();
  if (s === '') return '';
  if (t === 'int' || t === 'year') return /^-?\d+$/.test(s) ? +s : s;
  if (t === 'dec') { var x = s.replace(',', '.'); return /^-?\d+(\.\d+)?$/.test(x) ? +x : s; }
  if (t === 'date') return U.parseFr(s) || s;
  if (upper) return s.toUpperCase();
  return s;
};
FUI.showVal = function (t, val) {
  if (val === undefined || val === null) return '';

};
FUI.formatIssues = function (f, v) {   // format des nombres (bloquant)

    if (x.t === 'year' && typeof val === 'number' && (val < 1900 || val > 2100)) out.push(SCH.issue('B', f, x.k, 'Année sur 4 chiffres attendue.'));
    if (x.t === 'dec' && typeof val === 'string' && val !== '') out.push(SCH.issue('B', f, x.k, 'Nombre attendu (virgule pour les décimales).'));
    if ((x.t === 'lab' || x.t === 'hba1c' || x.t === 'gaj') && val && typeof val.v === 'string' && val.v !== '') out.push(SCH.issue('B', f, x.k, 'Nombre attendu (virgule pour les décimales).'));

  });
  (v.MEDS || []).forEach(function (m, i) {

/* différences entre deux versions d'un formulaire (pour le motif et le journal d'audit) */

  Object.keys(keys).forEach(function (k) {
    if (k === 'MEDS') {
      var ra = (a && a.MEDS) || [], rb = (b && b.MEDS) || [], n = Math.max(ra.length, rb.length);
      for (var i = 0; i < n; i++) ['CLASSE', 'MOL', 'MOL_AUT', 'DOSE', 'PRISES', 'AF'].forEach(function (c) {
        var x = ra[i] ? ra[i][c] : undefined, y = rb[i] ? rb[i][c] : undefined;
        if (JSON.stringify(x === undefined ? null : x) !== JSON.stringify(y === undefined ? null : y)) out.push({ k: 'MEDS.' + i + '.' + c, field: f + '_MED' + (i + 1) + '_' + c, old: x, val: y, label: 'Ligne ' + (i + 1) + ' — ' + { CLASSE: 'classe', MOL: 'molécule', MOL_AUT: 'molécule (autre)', DOSE: 'dose', PRISES: 'prises / jour', AF: 'association fixe' }[c] });

    if (y && typeof y === 'object' && !Array.isArray(y)) y = y.v === undefined || y.v === '' ? undefined : U.num(y.v) + ' ' + y.u;
    if ((x === undefined || x === '' || x === null) && (y === undefined || y === '' || y === null)) return;
    if ((x === 0 || x === undefined) && (y === 0 || y === undefined) && /^(COM_|MHD_|MICRO_)/.test(k)) return;
    if (JSON.stringify(x) !== JSON.stringify(y)) {

/* enregistre un formulaire ; opt : { motif, comment, viaQuery } */
FUI.commit = function (buf, opt) {

  var now = APP.now();

  P.forms[f] = { v: v, savedAt: prev ? prev.savedAt : now, modAt: prev ? now : undefined, revAt: keepRev ? prev.revAt : (prev && !diffs.length ? prev.revAt : null), draft: draft || undefined };

  diffs.forEach(function (d) {

    });

  var doSave = function (motif, comment) {

    APP.render();

ACT.ansCorrect = function (el) {
  var S = APP.cur(), q = S.queries.filter(function (x) { return x.id === el.dataset.qid; })[0], P = q.pid ? APP.patient(q.pid) : null, me = APP.me();
  var text = (document.getElementById('ansText') || {}).value.trim(); APP.ansText = text;

  var changes = [];
  bufs.forEach(function (k) {
    var b = APP.bufs[k], cur = P ? P.forms[b.f].v : APP.centre(me.centre).F0;
    FUI.diff(b.f, cur, SCH.clean(b.f, U.clone(b.v))).forEach(function (d) { changes.push({ buf: k, f: b.f, d: d }); });
  });
  if (!changes.length) { toast('Aucune valeur modifiée', 'Saisissez la nouvelle valeur ou utilisez « Répondre sans corriger ».', 'amber', 'circle-alert'); return; }
  // contrôles bloquants
  for (var i = 0; i < bufs.length; i++) {
    var r = FUI.validate(bufs[i], P || { forms: {}, visit: null });

  }

  if (!text) text = motif + ' : ' + auto + '.';
  bufs.forEach(function (k) {

/* ==========================================================================
   ÉTAPE 3 — CIRCUIT DES REQUÊTES (côté CRO : ARC et chef de projet)
   Liste des requêtes (écran 8), clore · relancer · rappel, ouverture depuis un champ,
   historique complet de chaque requête, compteurs à 4 états.

var QRY = {};

QRY.formPill = function (f) { var fd = REF.FORM_BY_KEY[f] || { name: f, color: '#64748B' }; return '<span class="pill fpill" style="background:' + fd.color + '1F;color:' + fd.color + '">' + U.esc(fd.name) + '</span>'; };

QRY.STATE = { ouverte: ['Ouverte', 'p-red', 'red'], relancee: ['Relancée par la CRO', 'p-red', 'red'], repondue: ['Répondue', 'p-amber', 'amber'], close: ['Close', 'p-green', 'green'] };
QRY.label = function (f, fl, k) {
  if (fl && fl.ql) return fl.ql;
  if (fl && fl.t === 'cases') { var p = { COMBOX: 'Comorbidités', MHDBOX: 'Mesures hygiéno-diététiques', MICROBOX: 'Complications microvasculaires' }[fl.k]; if (p) return p; }
  return fl ? fl.l : k;
};
/* urgence pour le tri : rouges par ancienneté, puis répondues (attente CRO), puis closes */
QRY.urgency = function (q, S, hol) {   // 1) rouges > 5 j ouvrés (rappel) · 2) répondues (à clore ou relancer) · 3) autres rouges · 4) closes
  if (M.qRed(q)) { var ag = M.qAge(q, S, hol); return (ag > 5 ? 3000 : 1000) + ag * 10 + (q.status === 'relancee' ? 5 : 0); }
  if (q.status === 'repondue') return 2000 + U.wdBetween(M.lastEvent(q, 'answer').at.slice(0, 10), S.today, hol);
  return -U.diffDays(M.lastEvent(q).at.slice(0, 10), S.today);
};

/* ---------- Écran 8 : liste des requêtes ---------- */
QRY.page = function (me) {
  var S = APP.cur(), hol = APP.hol(), P = APP.params, seg = P.qs || 'all', gt5 = !!P.gt5;
  var all = S.queries;
  var cnt = { all: all.length, ouverte: 0, relancee: 0, repondue: 0, close: 0 }, n5 = 0;
  all.forEach(function (q) { cnt[q.status]++; if (M.qRed(q) && M.qAge(q, S, hol) > 5) n5++; });
  var list = all.filter(function (q) {
    if (seg !== 'all' && q.status !== seg) return false;
    if (gt5 && !(M.qRed(q) && M.qAge(q, S, hol) > 5)) return false;
    if (P.qc && q.c !== P.qc) return false;
    if (P.qf && q.form !== P.qf) return false;
    return true;
  });
  list.sort(function (a, b) { return QRY.urgency(b, S, hol) - QRY.urgency(a, S, hol); });
  var per = 20, pages = Math.max(1, Math.ceil(list.length / per)), page = Math.min(P.page || 1, pages);
  var rows = list.slice((page - 1) * per, page * per).map(function (q) { return QRY.row(q, me, S, hol); }).join('');
  var segs = [['all', 'Toutes', null], ['ouverte', 'Ouvertes', FLAG.red], ['relancee', 'Relancées', FLAG.red], ['repondue', 'Répondues', FLAG.amber], ['close', 'Closes', FLAG.green]];
  var segHtml = '<div class="seg">' + segs.map(function (s) {
    return '<span class="' + (seg === s[0] ? 'on' : '') + '" data-act="qseg" data-v="' + s[0] + '">' + (s[2] ? flagIc(seg === s[0] ? '#fff' : s[2], 12) : '') + s[1] + ' <span class="n">' + cnt[s[0]] + '</span></span>'; }).join('') + '</div>';
  var centres = S.centres.filter(function (c) { return S.queries.some(function (q) { return q.c === c.code; }); });
  var filters = '<div class="qfilters"><button class="gt5' + (gt5 ? ' on' : '') + '" data-act="qgt5">' + ic('clock', 13) + '> 5 j ouvrés · ' + n5 + '</button>' +
    '<select class="fsel" data-qf="qc"><option value="">Centre</option>' + centres.map(function (c) { return '<option value="' + c.code + '"' + (P.qc === c.code ? ' selected' : '') + '>' + c.code + ' — ' + U.esc(c.invShort) + '</option>'; }).join('') + '</select>' +
    '<select class="fsel" data-qf="qf"><option value="">Formulaire</option>' + REF.FORMS.concat([REF.FORM_BY_KEY.F0]).map(function (f) { return '<option value="' + f.k + '"' + (P.qf === f.k ? ' selected' : '') + '>' + U.esc(f.name) + '</option>'; }).join('') + '</select>' +
    ((P.qc || P.qf || gt5) ? '<button class="btn ghost sm" data-act="qreset">' + ic('x', 13) + 'Effacer</button>' : '') + '</div>';
  var pager = pages > 1 ? '<div class="pager"><button class="btn ghost sm" data-act="qpage" data-v="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>' + ic('chevron-right', 13) + '</button><span class="mono">' + page + ' / ' + pages + '</span><button class="btn ghost sm" data-act="qpage" data-v="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>' + ic('chevron-right', 13) + '</button></div>' : '';
  return '<div class="qtop">' + segHtml + filters + '</div>' +
    '<div class="card qtable"><table class="tbl"><thead><tr><th style="width:26px"></th><th>Patient</th><th>Formulaire</th><th>Champ</th><th>Échanges</th><th>Ouverte par</th><th>Délai</th><th style="width:186px"></th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="8" class="muted" style="padding:16px">Aucune requête pour ces filtres.</td></tr>') + '</tbody></table>' +
    '<div class="qfoot"><div class="legend"><span>' + flagIc(FLAG.red, 13) + 'ouverte ou relancée par la CRO, en attente de l\'investigateur</span><span>' + flagIc(FLAG.amber, 13) + 'répondue, à valider par la CRO</span><span>' + flagIc(FLAG.green, 13) + 'close</span></div>' +
    '<span class="muted" style="font-size:11px">' + list.length + ' requête' + (list.length > 1 ? 's' : '') + '</span>' + pager + '</div>' +
    '<div class="qnote">Délai de réponse attendu : 5 jours ouvrés ; au-delà, « Rappel » envoie un e-mail avec le lien direct vers la requête.</div></div>';
};
QRY.row = function (q, me, S, hol) {
  var c = FUI.qColor(q), open = q.ev[0], age = M.qAge(q, S, hol), can = QRY.canAct(me);
  var ex = q.ev.filter(function (e) { return e.t !== 'close' && e.t !== 'rappel'; }).slice(-2).map(function (e) {
    if (e.t === 'open' && q.ev.length === 1) return '<div class="ex">« ' + U.esc(e.text) + ' »</div>';
    var w = FUI.who(e.by);
    return '<div class="ex ' + (e.t === 'answer' ? 'a' : e.t === 'relance' ? 'r' : '') + '"><b>' + w + ' · ' + U.frShort(e.at) + '</b> — « ' + U.esc(e.text) + ' »</div>';
  }).join('');
  var delay;
  if (q.status === 'ouverte') delay = '<span class="dpill ' + (age > 5 ? 'hot' : 'red') + '">' + age + ' j</span>';
  else if (q.status === 'relancee') delay = '<span class="dpill red">relancée ' + U.frShort(M.lastEvent(q, 'relance').at) + '</span>';
  else if (q.status === 'repondue') delay = '<span class="dpill amber">répondue ' + U.frShort(M.lastEvent(q, 'answer').at) + '</span>';
  else delay = '<span class="dpill green">close ' + U.frShort(M.lastEvent(q, 'close').at) + '</span>';
  var rap = q.ev.filter(function (e) { return e.t === 'rappel'; }).length;
  delay += '<div class="dsub mono">' + U.fr(open.at) + (rap ? ' · ' + rap + ' rappel' + (rap > 1 ? 's' : '') : '') + '</div>';
  var acts = '';

/* ---------- Détail d'une requête : historique complet + actions ---------- */
QRY.detail = function (qid) {
  var S = APP.cur(), q = QRY.get(qid), me = APP.me(); if (!q) return;
  var c = FUI.qColor(q), st = QRY.STATE[q.status], age = M.qAge(q, S, APP.hol());
  var corr = S.audit.filter(function (a) { return a.qid === q.id && a.old !== undefined; });
  var tl = q.ev.map(function (e, i) {
    var lab = { open: 'Requête ouverte', answer: e.fix ? 'Réponse avec correction' : 'Réponse sans correction', relance: 'Relancée par la CRO', close: 'Close par la CRO', rappel: 'Rappel envoyé par e-mail' }[e.t];
    var col = { open: 'red', answer: 'amber', relance: 'red', close: 'green', rappel: 'orange' }[e.t];
    var extra = '';
    if (e.t === 'answer' && e.fix) {

      if (cc.length) extra = '<div class="tlc">' + cc.map(function (a) { return '<span>' + U.esc(a.label || QRY.fieldLabel(a.field)) + ' : <s>' + U.esc(a.old) + '</s> → <b>' + U.esc(a.val) + '</b>' + (a.motif ? ' · motif : ' + U.esc(a.motif) : '') + '</span>'; }).join('') + '</div>';

      '<div class="tlw">' + U.esc(FUI.who(e.by)) + (e.t === 'answer' ? ' (investigateur)' : e.by === 'eCRF' ? ' (contrôle automatique)' : '') + '</div>' + (e.text ? '<div class="tlt">« ' + U.esc(e.text) + ' »</div>' : '') + extra + '</div></div>';

  var can = QRY.canAct(me), btns = [];

  if (can && M.qRed(q)) btns.push('<button class="btn orange" data-act="qrappel" data-qid="' + q.id + '"' + (age > 5 ? '' : ' data-tip="Rappel conseillé au-delà de 5 jours ouvrés"') + '>' + ic('mail', 15) + 'Rappel</button>');
  if (q.pid && me.kind !== 'servier' && me.kind !== 'pv') btns.push('<button class="btn ghost" data-act="qopenp" data-pid="' + q.pid + '" data-tab="' + q.form + '">' + ic('file-text', 15) + 'Ouvrir le dossier</button>');
  if (!q.pid && (me.kind === 'arc' || me.kind === 'cp')) btns.push('<button class="btn ghost" data-act="opencentre" data-c="' + q.c + '">' + ic('building-2', 15) + 'Fiche du centre</button>');
  var head = '<div class="qdh"><span class="pill ' + st[1] + '">' + flagIc(FLAG[c], 12) + st[0] + '</span>' + (M.qRed(q) ? '<span class="pill ' + (age > 5 ? 'p-solid-red' : 'p-red') + '">' + (age ? 'depuis ' + age + ' j ouvré' + (age > 1 ? 's' : '') : 'aujourd\'hui') + '</span>' : '') +
    QRY.formPill(q.form) + '<span class="muted">Centre ' + q.c + ' · ' + U.esc(QRY.inv(q)) + '</span></div>' +
    '<div class="qdl"><span class="b">' + U.esc(q.label) + '</span> <span class="mono muted">' + U.esc(q.field) + '</span></div>';
  modal({ icon: 'flag', color: FLAG[c], title: 'Requête ' + (q.pid || 'profil ' + q.c) + ' · ' + q.id, wide: true,
    html: head + '<div class="tlist">' + tl + '</div>', extra: btns.join(''), ok: 'Fermer', okClass: 'ghost', noCancel: true });
};

/* libellé d'un champ à partir de son identifiant (F2_POIDS, F4_MED2_DOSE…) */
QRY.fieldLabel = function (id) {
  var m = /^(F\d)_(.+)$/.exec(id || ''); if (!m) return id || '';
  var mm = /^MED(\d)_(\w+)$/.exec(m[2]);
  if (mm) return 'Ligne ' + mm[1] + ' — ' + ({ CLASSE: 'classe', MOL: 'molécule', DOSE: 'dose', PRISES: 'prises par jour', AF: 'association fixe' }[mm[2]] || mm[2]);
  var fl = SCH.field(m[1], m[2]); if (fl) return fl.ql || fl.l;
  var cs = SCH.F[m[1]] ? SCH.fields(m[1]).filter(function (x) { return x.t === 'cases' && x.o.some(function (o) { return o[0] === m[2]; }); })[0] : null;
  if (cs) { var par = QRY.label(m[1], cs, cs.k); return par + ' : ' + cs.o.filter(function (o) { return o[0] === m[2]; })[0][1]; }
  return id;
};
/* valeur enregistrée d'un champ (identifiant de requête F#_CHAMP) */
QRY.curVal = function (P, f, id, c) {
  if (f === 'F0') { var cc = APP.centre(c || (P && P.c)); if (!cc) return ''; var fl0 = SCH.field('F0', id.slice(3)); return fl0 ? FUI.fmt('F0', fl0.k, cc.F0[fl0.k], cc.F0) : ''; }
  if (!P || !P.forms[f]) return '';
  var v = P.forms[f].v, k = id.slice(3), mm = /^MED(\d)_(\w+)$/.exec(k);
  if (mm) { var r = (v.MEDS || [])[+mm[1] - 1] || {}; if (mm[2] === 'MOL') return (r.CLASSE ? r.CLASSE + ' · ' : '') + (r.MOL === 'Autre' ? r.MOL_AUT || 'Autre' : r.MOL || '—'); return FUI.fmt(f, 'MEDS.' + (+mm[1] - 1) + '.' + mm[2], r[mm[2]]); }
  var fl = SCH.field(f, k); if (!fl) return '';
  if (fl.t === 'calc') { var x = fl.calc(v); return x ? x + ' ' + (fl.u || '') + ' (' + FUI.fmt('F2', 'POIDS', v.POIDS) + ', ' + FUI.fmt('F2', 'TAILLE', v.TAILLE) + ')' : '—'; }
  if (fl.t === 'diag') return INV.diagTxt(fl, v);
  if (fl.t === 'cases') return FUI.fmt(f, fl.k, 1, v);
  return FUI.fmt(f, fl.k, v[fl.k], v);
};
