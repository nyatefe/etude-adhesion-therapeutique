/* ==========================================================================
   ÉTAPE 4 — PROFIL ARC (GAYA PHARMA)
   Tableau de bord multicentre (écran 7), file de revue et « Marquer comme revu »,
   patients de tous les centres, centres (lecture) et fiche du centre,
   alertes item 9, journal des déviations.
   (Réception des enveloppes et double saisie des questionnaires : 75_quest.js)
   ========================================================================== */
var ARC = {};
ARC.regColor = function (c) { return REF.REGIONS[c.region] || '#64748B'; };
ARC.code = function (c, big) { return '<span class="ccode' + (big ? ' big' : '') + '" style="background:' + ARC.regColor(c) + '">' + c.code + '</span>'; };
ARC.avatar = function (c) { return '<span class="cav" style="background:' + ARC.regColor(c) + '">' + (c.prenom[0] + c.nom[0]).toUpperCase() + '</span>'; };
ARC.age = function (n) { return n + ' j ouvré' + (n > 1 ? 's' : ''); };
ARC.canEdit = function (me) { return QRY.canAct(me); };

/* ---------- État d'un centre (tuiles) ---------- */
ARC.centreState = function (S, c, set) {
  var K = M.counts(S, set, c.code), why = [];
  if (c.statut === 'En préparation') return { st: 'prep', K: K, why: ['Centre en préparation : pas encore d\'autorisation d\'inclure'] };
  var rd = M.recruitDay(S, set), exp = 20 * rd.day / rd.total;
  var red = false, amber = false;
  if (K.q.gt5 >= 3) { red = true; why.push(K.q.gt5 + ' requêtes ouvertes depuis plus de 5 j ouvrés'); }
  if (K.included === 0) { amber = true; why.push('aucune inclusion visible'); }
  if (K.alertsCrit) { red = true; why.push('alerte item 9 critique'); }
  if (K.q.gt5 > 0 && K.q.gt5 < 3) { amber = true; why.push(K.q.gt5 + ' requête' + (K.q.gt5 > 1 ? 's' : '') + ' > 5 j ouvrés'); }
  if (K.red >= 3 && K.q.gt5 < 3) { amber = true; why.push(K.red + ' requêtes à traiter'); }
  if (K.included > 0 && !rd.ended && K.included < 0.6 * exp) { amber = true; why.push('rythme d\'inclusion faible'); }
  if (S.today >= set.collectStart && K.missing.length) { amber = true; why.push(K.missing.length + ' enveloppe' + (K.missing.length > 1 ? 's' : '') + ' manquante' + (K.missing.length > 1 ? 's' : '')); }
  if (K.alertsPending && !K.alertsCrit) { amber = true; why.push('alerte item 9 en attente'); }
  return { st: red ? 'red' : amber ? 'amber' : 'green', K: K, why: why.length ? why : ['aucun point d\'attention'] };
};
ARC.ST = { green: 'Conforme', amber: 'À surveiller', red: 'Action requise', prep: 'En préparation' };

/* ---------- File de revue ---------- */
ARC.queue = function (S, hol, c) {
  return M.included(S, c).filter(function (p) { return M.complete(p) && !M.reviewed(p); }).map(function (p) {
    var at = M.completedAt(p); return { p: p, at: at, age: U.wdBetween(at.slice(0, 10), S.today, hol) };
  }).sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; });
};
ARC.revCount = function (P) {
  var n = 0, r = 0; M.FORM_ORDER.forEach(function (f) { var s = M.formState(P, f); if (s === 'filled') n++; if (s === 'rev') { n++; r++; } }); return { n: n, r: r };
};

/* ---------- Écran 7 : tableau de bord multicentre ---------- */
ARC.dashHead = function (me, info) {
  var S = APP.cur(), set = APP.set, rd = M.recruitDay(S, set);
  var sub = S.centres.length + ' centres · ' + U.dayName(S.today) + ' ' + U.fr(S.today) + ' · ' + (rd.ended ? 'recrutement terminé le ' + U.fr(set.recruitEnd) : 'recrutement jour ' + rd.day + ' sur ' + rd.total);
  var right = '';
  if (S.today < set.collectStart) {
    var dd = U.diffDays(S.today, set.collectStart);
    right = '<span class="pill p-orange hpill">' + ic('truck', 14) + 'Collecte unique des questionnaires dans ' + dd + ' jours · ' + U.frShort(set.collectStart) + ' → ' + U.fr(set.collectEnd) + '</span>';
  } else {
    var K = M.counts(S, set);
    right = '<span class="pill p-violet hpill">' + ic('package-open', 14) + 'Collecte unique faite du ' + U.frShort(set.collectStart) + ' au ' + U.fr(set.collectEnd) + ' · ' + K.lots + ' lots reçus sur ' + K.lotsExpected + '</span>';
  }
  return '<div class="h2row"><div><div class="h2">' + U.esc(info.title) + '</div><div class="h2s">' + U.esc(sub) + '</div></div>' + right + '</div>' + PAGES.kpisFor(me);
};
ARC.curve = function (S, set, pal) {
  pal = pal || { a: '#6366F1', b: '#EC4899', m: '#8B5CF6', d: '#7C3AED', id: 'a' };
  var days = U.range(set.recruitStart, set.recruitEnd), n = days.length, byDay = {};
  M.byDay(S, set).forEach(function (d) { byDay[d[0]] = d[1]; });
  var W = 560, H = 250, l = 38, r = 22, t = 24, b = 28, yMax = 650;
  var x = function (i) { return l + i * (W - l - r) / (n - 1); }, y = function (v) { return t + (H - t - b) * (1 - v / yMax); };
  var cum = 0, pts = [];

    '<linearGradient id="gca' + pal.id + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + pal.m + '" stop-opacity=".28"/><stop offset="1" stop-color="' + pal.b + '" stop-opacity="0"/></linearGradient></defs>' +
    grid + xl + obj + (area ? '<path d="' + area + '" fill="url(#gca' + pal.id + ')"/>' : '') + (line ? '<path d="' + line + '" fill="none" stroke="url(#gcl' + pal.id + ')" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' : '') + dots + bub + hov + '</svg>';

  if (el.dataset.k === 'FORM_RECU' && b.FORM_RECU === 1) { var i = document.getElementById('pvDat'); if (i && !i.value) i.value = U.fr(APP.cur().today); }
  [['pvRecu', 'FORM_RECU', function (v) { return v === 1 ? 'on-g' : 'on-n'; }], ['pvSt', 'STATUT', function (v) { return v === 2 ? 'on-g' : 'on-n'; }]].forEach(function (g) {
    var box = document.getElementById(g[0]); if (!box) return;
    box.querySelectorAll('span[data-v]').forEach(function (s) { s.className = +s.dataset.v === b[g[1]] ? g[2](b[g[1]]) : ''; });
  });
};

/* ---------- Réconciliation ---------- */
PAGES['pv.recon'] = function (me) {
  var S = APP.cur(), hol = APP.hol(), all = PV.list(S).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  var nr = 0, late = 0, ok = 0, rec = 0;
  var rows = all.map(function (p) {
    var v = p.forms.F7.v, x = PV.pv(p), d = PV.delay(p, hol), c = APP.centre(p.c), gaps = [];
    if (x.STATUT === 2) ok++; else rec++;
    if (x.FORM_RECU !== 1) { nr++; gaps.push(['p-red', 'formulaire non reçu']); }
    if (d.late) { late++; gaps.push(['p-amber', v.DECL === 1 ? 'déclaration hors délai' : 'déclaration non envoyée (eCRF)']); }
    if (x.FORM_RECU === 1 && v.DECL !== 1) gaps.push(['p-amber', 'reçu mais non déclaré dans l\'eCRF']);
    var act = x.STATUT === 2 ? '<span class="okc">' + ic('circle-check', 15, '#059669') + 'Réconcilié</span>' : x.FORM_RECU === 1 ? '<button class="btn sm green" data-act="pvok" data-pid="' + p.id + '">' + ic('check', 13) + 'Réconcilier</button>' : '<button class="btn sm ghost" data-act="pvdetail" data-pid="' + p.id + '">Enregistrer la réception</button>';
    return '<tr><td class="code">' + p.id + '</td><td>' + ARC.code(c) + ' <span class="b">' + U.esc(c.invShort) + '</span></td><td>' + (v.GRAVE === 1 ? '<span class="pill p-solid-red">Grave</span>' : '<span class="pill p-grey">Non grave</span>') + '</td>' +
      '<td><div class="rc ecrf"><span>eCRF</span>' + (v.DECL === 1 ? 'déclaration envoyée le <b>' + U.fr(v.DECLDAT) + '</b>' : '<b>non envoyée</b>') + ' · <span class="dpill ' + (d.late ? 'red' : 'green') + '">' + d.txt + '</span></div></td>' +
      '<td><div class="rc pvs"><span>PV</span>' + (x.FORM_RECU === 1 ? 'PHARMA-FORM-032 reçu le <b>' + U.fr(x.FORM_DAT) + '</b>' + (x.NUM ? ' · <span class="mono">' + U.esc(x.NUM) + '</span>' : '') : '<b>non reçu</b>') + '</div></td>' +
      '<td>' + (gaps.length ? gaps.map(function (g) { return '<span class="pill ' + g[0] + '" style="margin:1px 3px 1px 0">' + g[1] + '</span>'; }).join('') : '<span class="pill p-green">concordant</span>') + '</td><td style="text-align:right">' + act + '</td></tr>';
  }).join('');
  var kp = '<div class="kpis" style="grid-template-columns:repeat(4,1fr)">' +
    VIEW.kpi('g-amber', 'git-compare', 'À réconcilier', rec, ' / ' + all.length, 'eCRF ↔ PHARMA-FORM-032') +
    VIEW.kpi('g-rose', 'file-warning', 'Formulaires non reçus', nr, '', 'PHARMA-FORM-032 attendus') +
    VIEW.kpi('g-orange', 'clock', 'Déclarations hors délai', late, '', 'EIG > 1 jour ouvré · EI > 2 jours ouvrés') +
    VIEW.kpi('g-emerald', 'circle-check', 'Réconciliés', ok, ' / ' + all.length, 'déclaration et formulaire concordants', all.length ? 100 * ok / all.length : 0) + '</div>';
  return kp + '<div class="card" style="padding:8px 10px 10px"><table class="tbl ptbl nohov recon"><thead><tr><th>Patient</th><th>Centre</th><th>Gravité</th><th>Déclaration (eCRF)</th><th>Réception (pharmacovigilance)</th><th>Écarts</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
};
ACT.pvok = function (el) {
  var me = APP.me(), p = APP.patient(el.dataset.pid); if (!p || !PV.canEdit(me)) return;
  var x = PV.pv(p); if (x.FORM_RECU !== 1) return;
  x.STATUT = 2; APP.log({ action: 'Suivi pharmacovigilance', pid: p.id, form: 'F7', detail: 'réconcilié · ' + (x.NUM || '') });
  APP.save(); APP.render(); toast('EI réconcilié', p.id + (x.NUM ? ' · ' + x.NUM : ''), 'green', 'circle-check');
};

/* ---------- Messages à l'investigateur (par code patient) ---------- */
PV.threads = function (S, c) {
  var by = {};
  (S.msgs || []).forEach(function (m) { if (c && m.c !== c) return; (by[m.pid] = by[m.pid] || []).push(m); });
  return Object.keys(by).map(function (pid) { var l = by[pid].sort(function (a, b) { return a.at < b.at ? -1 : 1; }); return { pid: pid, c: l[0].c, msgs: l, last: l[l.length - 1] }; })
    .sort(function (a, b) { return a.last.at < b.last.at ? 1 : -1; });
};
PV.bubbles = function (msgs, meIsPv) {
  return '<div class="msgs">' + msgs.map(function (m) {
    var mine = meIsPv ? m.from === 'pv' : m.from !== 'pv';
    return '<div class="pvm' + (mine ? ' mine' : '') + '"><div class="pvmh"><b>' + (m.from === 'pv' ? 'Pharmacovigilance · Servier Maroc' : U.esc(FUI.who(m.from))) + '</b><span class="mono">' + U.fr(m.at) + ' · ' + U.time(m.at) + '</span></div><div class="pvmt">' + U.esc(m.text) + '</div></div>';
  }).join('') + '</div>';
};
PV.send = function (pid, text, from) {
  var S = APP.cur(), p = APP.patient(pid); S.msgs = S.msgs || [];
  var m = { id: 'M' + ('0' + (S.msgs.length + 1)).slice(-2) + '_' + Date.now().toString(36).slice(-3), pid: pid, c: p.c, from: from, at: APP.now(), text: text };
  S.msgs.push(m);
  if (from !== 'pv') S.notifs.push({ id: 'N' + (S.notifs.length + 1) + '_pv', to: 'pv', at: m.at, icon: 'mail', tone: 'blue', text: 'Réponse de ' + FUI.who(from) + ' · patient ' + pid, go: 'messages', gp: { pid: pid }, read: false });
  APP.log({ action: from === 'pv' ? 'Message à l\'investigateur (pharmacovigilance)' : 'Réponse à la pharmacovigilance', pid: pid, detail: text.slice(0, 120) });
  return m;
};
PAGES['pv.messages'] = function (me) {
  var S = APP.cur(), th = PV.threads(S), sel = APP.params.pid || (th[0] && th[0].pid), cur = th.filter(function (t) { return t.pid === sel; })[0];
  var left = '<div class="card thl"><div class="ch"><span class="ic" style="background:#FCE7F3;color:#BE123C">' + ic('mail', 16) + '</span><div><div class="t">Échanges</div><div class="s">par code patient</div></div><div class="sp"></div>' +
    (PV.canEdit(me) ? '<button class="btn sm prof" data-act="pvwrite">' + ic('pencil', 13) + 'Nouveau</button>' : '') + '</div>' +
    (th.length ? th.map(function (t) { var c = APP.centre(t.c); return '<div class="thi' + (t.pid === sel ? ' on' : '') + '" data-act="pvth" data-pid="' + t.pid + '"><div><span class="code">' + t.pid + '</span> <span class="muted" style="font-size:11px">' + U.esc(c.invShort) + '</span></div><div class="ths">' + U.esc(t.last.text.slice(0, 70)) + '…</div><div class="mono muted" style="font-size:10px">' + U.fr(t.last.at) + ' · ' + t.msgs.length + ' message' + (t.msgs.length > 1 ? 's' : '') + '</div></div>'; }).join('') : '<div class="empty-st sm">' + ic('mail', 20, '#94A3B8') + '<div>Aucun échange.</div></div>') + '</div>';
  var right;
  if (!cur) right = '<div class="card"><div class="empty-st">' + ic('mail', 24, '#94A3B8') + '<div>Choisir un échange ou écrire à l\'investigateur d\'un patient ayant un événement indésirable.</div></div></div>';
  else {
    var c = APP.centre(cur.c), p = APP.patient(cur.pid);
    right = '<div class="card"><div class="ch"><span class="ic" style="background:#FFE4E6;color:#E11D48">' + ic('user-round', 16) + '</span><div><div class="t">Patient ' + cur.pid + ' · ' + U.esc(c.inv) + '</div><div class="s">centre ' + c.code + ' · ' + U.esc(c.ville) + ' · seul le code patient est échangé</div></div><div class="sp"></div>' +
      (p ? '<button class="btn ghost sm" data-act="pvdetail" data-pid="' + cur.pid + '">' + ic('triangle-alert', 13) + 'Fiche de l\'EI</button>' : '') + '</div>' + PV.bubbles(cur.msgs, true) +
      (PV.canEdit(me) ? '<div class="msgw"><textarea class="inp ta" id="pvMsg" placeholder="Message à ' + U.esc(c.invShort) + '…"></textarea><button class="btn green" data-act="pvsend" data-pid="' + cur.pid + '">' + ic('send', 15) + 'Envoyer</button></div>' : '') + '</div>';
  }
  return '<div class="msggrid">' + left + right + '</div><div class="note" style="margin-top:12px">Démonstration : le message arrive dans la cloche de l\'investigateur du centre (code patient seul) ; sa réponse revient ici. Aucun e-mail n\'est réellement envoyé.</div>';
};
ACT.pvth = function (el) { APP.params.pid = el.dataset.pid; APP.render(); };
ACT.pvsend = function (el) {
  var me = APP.me(), t = (document.getElementById('pvMsg').value || '').trim(); if (!PV.canEdit(me)) return;
  if (!t) { toast('Message vide', '', 'red', 'circle-alert'); return; }
  var p = APP.patient(el.dataset.pid); PV.send(p.id, t, 'pv'); APP.save(); APP.render();
  toast('Message envoyé', APP.centre(p.c).invShort + ' · patient ' + p.id, 'green', 'send');
};
ACT.pvwrite = function (el) {
  var S = APP.cur(), me = APP.me(); if (!PV.canEdit(me)) return;
  var pre = el && el.dataset && el.dataset.pid, all = PV.list(S).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  var p0 = pre ? APP.patient(pre) : null;
  var def = p0 && PV.pv(p0).FORM_RECU !== 1 ? 'Bonjour Docteur, l\'événement indésirable' + (p0.forms.F7.v.GRAVE === 1 ? ' grave' : '') + ' du patient ' + p0.id + ' a été renseigné dans l\'eCRF le ' + U.fr(p0.forms.F7.savedAt) + '. Nous n\'avons pas encore reçu le formulaire PHARMA-FORM-032 : merci de nous l\'envoyer dès que possible.' : '';
  modal({ icon: 'mail', color: '#BE123C', title: 'Écrire à l\'investigateur', wide: true,
    html: '<div class="fl">Patient (code seul)</div><select class="fsel" id="pvTo" style="width:100%">' + all.map(function (p) { return '<option value="' + p.id + '"' + (p.id === pre ? ' selected' : '') + '>' + p.id + ' · ' + U.esc(APP.centre(p.c).inv) + ' · EI du ' + U.fr(p.forms.F7.savedAt) + '</option>'; }).join('') + '</select>' +
      '<div class="fl" style="margin-top:10px">Message</div><textarea class="inp ta" id="pvTxt" style="min-height:100px">' + U.esc(def) + '</textarea>' +
      '<div class="note" style="margin-top:10px">Coordonnées de la pharmacovigilance de Servier Maroc <span class="tag-conf">à compléter</span> · seul le code patient est transmis.</div>',
    ok: 'Envoyer', okClass: 'green', keep: true,
    onOk: function () {
      var pid = document.getElementById('pvTo').value, t = (document.getElementById('pvTxt').value || '').trim();
      if (!t) { toast('Message vide', '', 'red', 'circle-alert'); return false; }
      PV.send(pid, t, 'pv');
      setTimeout(function () { APP.go('messages', { pid: pid }); toast('Message envoyé', APP.centre(pid.slice(0, 2)).invShort + ' · patient ' + pid, 'green', 'send'); }, 0);
    } });
};

/* ---------- Côté investigateur : lire et répondre ---------- */
PV.thread = function (mid) {
  var S = APP.cur(), me = APP.me(), m = (S.msgs || []).filter(function (x) { return x.id === mid; })[0]; if (!m || me.kind !== 'inv' || m.c !== me.centre) return;
  var t = PV.threads(S, me.centre).filter(function (x) { return x.pid === m.pid; })[0];
  modal({ icon: 'mail', color: '#BE123C', title: 'Pharmacovigilance · patient ' + m.pid, wide: true,
    html: PV.bubbles(t.msgs, false) + (S.frozen ? '' : '<div class="fl" style="margin-top:10px">Votre réponse</div><textarea class="inp ta" id="invRep" placeholder="Réponse à la pharmacovigilance…"></textarea>'),
    ok: S.frozen ? 'Fermer' : 'Répondre', okClass: S.frozen ? 'ghost' : 'green', cancel: 'Fermer', noCancel: !!S.frozen, keep: !S.frozen,
    onOk: function () {
      if (S.frozen) return true;
      var r = (document.getElementById('invRep').value || '').trim(); if (!r) { toast('Réponse vide', '', 'red', 'circle-alert'); return false; }
      PV.send(m.pid, r, me.id);
      setTimeout(function () { APP.save(); APP.render(); toast('Réponse envoyée à la pharmacovigilance', 'patient ' + m.pid, 'green', 'send'); }, 0);
    } });
};
ACT.invmsg = function (el) { PV.thread(el.dataset.id); };
(function () {   // carte « Messages de la pharmacovigilance » dans les alertes de l'investigateur
  var base = PAGES['inv.alerts'];
  PAGES['inv.alerts'] = function (me) {
    var h = base(me), th = PV.threads(APP.cur(), me.centre); if (!th.length) return h;
    var card = VIEW.card('mail', '#BE123C', 'Messages de la pharmacovigilance', 'Servier Maroc · par code patient', th.map(function (t) {
      var lastPv = t.msgs.filter(function (m) { return m.from === 'pv'; }).pop() || t.last;
      return '<div class="trow" data-act="invmsg" data-id="' + lastPv.id + '"><span class="tic red">' + ic('mail', 16, '#BE123C') + '</span><div class="tt"><div><span class="code">' + t.pid + '</span> <b>' + t.msgs.length + ' message' + (t.msgs.length > 1 ? 's' : '') + '</b></div><div class="tsub">' + U.esc(t.last.text) + '</div></div><span class="mono muted" style="font-size:11px">' + U.frShort(t.last.at) + '</span><button class="btn sm ghost tbtn">Ouvrir</button></div>';
    }).join(''));
    var i = h.lastIndexOf('</div></div>'); return h.slice(0, i) + card + h.slice(i);
  };
})();

</script>
</body>
</html>
